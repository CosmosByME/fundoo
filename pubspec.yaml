name: fundoo
description: "A new Flutter project."
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.11.5


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: 
    sdk: flutter


  cupertino_icons: ^1.0.8
  bloc: ^9.2.0
  flutter_svg: ^2.2.4
  go_router: ^17.2.2
  flutter_native_splash: ^2.4.7
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  pinput: ^6.0.2
  mask_text_input_formatter: ^2.9.0
  image_picker: ^1.2.2
  dotted_border: ^3.1.0
  fl_chart: ^1.2.0
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  fluttertoast: ^9.0.0
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png


flutter:


  uses-material-design: true

  generate: true


  assets:
    - assets/images/


